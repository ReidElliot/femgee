<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengee's Cute Corner ♡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@400;600;700&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 60px 20px;
    background: linear-gradient(135deg, #ffe3f0, #ffd1e8, #ffe9f5);
    font-family: 'Quicksand', sans-serif;
    color: #7a3b60;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "✨ 🎀 ✨ 🎀 ✨ 🎀 ✨ 🎀 ✨ 🎀 ✨ 🎀 ✨ 🎀 ✨";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    font-size: 1.5rem;
    opacity: 0.15;
    text-align: center;
    letter-spacing: 30px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    text-align: center;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }

  header h1 {
    font-family: 'Caveat', cursive;
    font-size: 4rem;
    margin: 0;
    color: #e0559c;
    text-shadow: 2px 2px 0px #fff, 3px 3px 8px rgba(224,85,156,0.3);
  }

  header h1::before,
  header h1::after {
    content: "🎀";
    font-size: 2.5rem;
    margin: 0 15px;
    vertical-align: middle;
  }

  header p {
    font-size: 1.2rem;
    color: #c96e9e;
    margin-top: 10px;
    font-weight: 600;
  }

  .gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .polaroid {
    background: #fffafc;
    padding: 16px 16px 34px 16px;
    box-shadow: 0 8px 24px rgba(224,85,156,0.25);
    width: 240px;
    border-radius: 14px;
    border: 3px solid #ffc2e0;
    transform: rotate(var(--rot));
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    cursor: pointer;
    position: relative;
  }

  .polaroid::after {
    content: "🎀";
    position: absolute;
    top: -14px;
    right: -10px;
    font-size: 1.8rem;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
  }

  .polaroid:hover {
    transform: rotate(0deg) scale(1.08);
    box-shadow: 0 16px 34px rgba(224,85,156,0.4);
    border-color: #ff8fc4;
    z-index: 5;
  }

  .polaroid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    border-radius: 8px;
  }

  .polaroid p {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 1.5rem;
    text-align: center;
    margin: 14px 0 0 0;
    color: #d6558f;
  }

  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 0.95rem;
    color: #c96e9e;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }

  footer span {
    font-family: 'Caveat', cursive;
    font-size: 1.5rem;
    display: block;
    margin-top: 6px;
    color: #e0559c;
  }

  .lightbox-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(122, 59, 96, 0.75);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 30px;
    cursor: zoom-out;
  }

  .lightbox-overlay.active {
    display: flex;
  }

  .lightbox-content {
    background: #fffafc;
    padding: 20px;
    border-radius: 16px;
    border: 4px solid #ffc2e0;
    max-width: 90vw;
    max-height: 90vh;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    text-align: center;
    cursor: default;
  }

  .lightbox-content img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
  }

  .lightbox-content p {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 1.8rem;
    color: #d6558f;
    margin: 16px 0 0 0;
  }
</style>
</head>
<body>

<header>
  <h1>Bengee's Cute Corner</h1>
  <p>a lil scrapbook, made with sparkles and love ♡</p>
</header>

<div class="gallery" id="gallery"></div>

<div class="lightbox-overlay" id="lightbox">
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <p id="lightbox-caption"></p>
  </div>
</div>

<footer>
  made with way too much affection ♡
  <span>here's to many more of these ✨</span>
</footer>

<script>
  // Add a new line here any time you want another photo on the page.
  // file: path to the image inside your repo (e.g. Bengee_Images/yourphoto.jpg)
  // caption: whatever text you want under it
  const photos = [
    { file: "Bengee_Images/photo1.jpg", caption: "the day it all started" },
    { file: "Bengee_Images/photo2.jpg", caption: "certified troublemakers" },
    { file: "Bengee_Images/photo3.jpg", caption: "best road trip ever" },
    { file: "Bengee_Images/photo4.jpg", caption: "that laugh though" },
    { file: "Bengee_Images/photo5.jpg", caption: "we don't take good pics but we take real ones" },
    { file: "Bengee_Images/photo6.jpg", caption: "10/10 would do again" },
    { file: "Bengee_Images/photo7.jpg", caption: "unplanned but iconic" },
    { file: "Bengee_Images/photo8.jpg", caption: "still my favorite person" },
    { file: "Bengee_Images/photo9.jpg", caption: "we were NOT ready for this" },
    { file: "Bengee_Images/photo10.jpg", caption: "core memory unlocked" }
  ];

  const gallery = document.getElementById("gallery");

  photos.forEach(photo => {
    const rot = (Math.random() * 10 - 5).toFixed(1);
    const div = document.createElement("div");
    div.className = "polaroid";
    div.style.setProperty("--rot", `${rot}deg`);
    div.innerHTML = `
      <img src="${photo.file}" alt="${photo.caption}">
      <p>${photo.caption}</p>
    `;
    div.addEventListener("click", () => openLightbox(photo));
    gallery.appendChild(div);
  });

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxCaption = document.getElementById("lightbox-caption");

  function openLightbox(photo) {
    lightboxImg.src = photo.file;
    lightboxImg.alt = photo.caption;
    lightboxCaption.textContent = photo.caption;
    lightbox.classList.add("active");
  }

  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") lightbox.classList.remove("active");
  });
</script>

</body>
</html>
